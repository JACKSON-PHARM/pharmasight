<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="he-bg" x1="0" y1="0" x2="520" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f0fdfa"/>
      <stop offset="0.45" stop-color="#ecfeff"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="he-line" x1="60" y1="280" x2="460" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="he-bar" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="he-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="520" height="440" rx="28" fill="url(#he-bg)"/>
  <rect x="24" y="24" width="472" height="392" rx="22" fill="#ffffff" fill-opacity="0.72"/>
  <g opacity="0.35" filter="url(#he-soft)">
    <ellipse cx="420" cy="72" rx="90" ry="70" fill="#99f6e4"/>
    <ellipse cx="100" cy="360" rx="110" ry="80" fill="#bae6fd"/>
  </g>
  <!-- Abstract KPI chips -->
  <rect x="52" y="56" width="118" height="52" rx="12" fill="#ffffff" stroke="#ccfbf1" stroke-width="1.5"/>
  <rect x="58" y="68" width="36" height="6" rx="3" fill="#94a3b8" fill-opacity="0.45"/>
  <rect x="58" y="82" width="72" height="10" rx="4" fill="#0d9488" fill-opacity="0.85"/>
  <rect x="196" y="56" width="118" height="52" rx="12" fill="#ffffff" stroke="#e0f2fe" stroke-width="1.5"/>
  <rect x="202" y="68" width="36" height="6" rx="3" fill="#94a3b8" fill-opacity="0.45"/>
  <rect x="202" y="82" width="56" height="10" rx="4" fill="#0369a1" fill-opacity="0.55"/>
  <!-- Mini bar cluster -->
  <g transform="translate(340 58)">
    <rect x="0" y="32" width="14" height="28" rx="4" fill="url(#he-bar)" opacity="0.9"/>
    <rect x="22" y="18" width="14" height="42" rx="4" fill="url(#he-bar)" opacity="0.75"/>
    <rect x="44" y="26" width="14" height="34" rx="4" fill="url(#he-bar)" opacity="0.95"/>
    <rect x="66" y="8" width="14" height="52" rx="4" fill="url(#he-bar)"/>
    <rect x="88" y="22" width="14" height="38" rx="4" fill="url(#he-bar)" opacity="0.85"/>
  </g>
  <!-- Trend area -->
  <path d="M56 312 C140 268 200 340 268 296 S380 220 464 176" stroke="url(#he-line)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M56 312 C140 268 200 340 268 296 S380 220 464 176 V392 H56 Z" fill="url(#he-line)" fill-opacity="0.12"/>
  <circle cx="56" cy="312" r="7" fill="#0f766e" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="268" cy="296" r="7" fill="#0d9488" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="464" cy="176" r="7" fill="#14b8a6" stroke="#ffffff" stroke-width="2.5"/>
  <!-- Donut hint -->
  <circle cx="400" cy="300" r="56" stroke="#e2e8f0" stroke-width="14" fill="none"/>
  <path d="M400 244 A56 56 0 1 1 352 328" stroke="#0d9488" stroke-width="14" stroke-linecap="round" fill="none"/>
  <circle cx="400" cy="300" r="22" fill="#ffffff"/>
  <!-- Grid dots -->
  <g fill="#94a3b8" fill-opacity="0.2">
    <circle cx="72" cy="200" r="2"/><circle cx="96" cy="200" r="2"/><circle cx="120" cy="200" r="2"/>
    <circle cx="72" cy="224" r="2"/><circle cx="96" cy="224" r="2"/><circle cx="120" cy="224" r="2"/>
    <circle cx="72" cy="248" r="2"/><circle cx="96" cy="248" r="2"/><circle cx="120" cy="248" r="2"/>
  </g>
</svg>
